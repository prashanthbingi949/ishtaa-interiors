name: Sync Ishtaa source images

on:
  push:
    branches: [main]
    paths:
      - 'assets/source-assets.json'
      - '.github/workflows/sync-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source images
        run: |
          mkdir -p assets/source
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          for item in json.loads(Path("assets/source-assets.json").read_text()):
              target=Path("assets/source")/item["file"]
              if target.exists() and target.stat().st_size:
                  continue
              req=urllib.request.Request(item["url"], headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  target.write_bytes(r.read())
          PY

      - name: Commit local copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Ishtaa project image assets"
          git push